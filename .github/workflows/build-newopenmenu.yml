name: Build NewOpenMenu

on:
  push:
    branches: [NewOpenMenu]
    paths:
      - 'openMenu/**'
      - '.github/workflows/build-newopenmenu.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: bios_rom host test
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -IopenMenu/src/bios_rom/include \
            openMenu/src/bios_rom/src/bios_rom.c openMenu/src/bios_rom/test/bios_rom_test.c -o bios_rom_test
          ./bios_rom_test
          gcc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -IopenMenu/src/bios_rom/include -IopenMenu/src/bios_engine/include \
            openMenu/src/bios_rom/src/bios_rom.c openMenu/src/bios_engine/src/*.c \
            openMenu/src/bios_engine/test/bios_engine_test.c -lm -o bios_engine_test
          ./bios_engine_test
          gcc -std=c99 -Wall -Wextra -Werror -IopenMenu/src/openmenu/src \
            openMenu/src/openmenu/test/serial_region_test.c openMenu/src/openmenu/src/serial_region.c -o serial_region_test
          ./serial_region_test
          gcc -std=c99 -Wall -Wextra -Werror -IopenMenu/external/uthash/include -IopenMenu/src/openmenu_shared/include/texture \
            openMenu/src/openmenu/test/serial_sanitize_test.c openMenu/src/openmenu_shared/src/texture/serial_sanitize.c -o serial_sanitize_test
          ./serial_sanitize_test
          gcc -std=c99 -Wall -Wextra -Werror -IopenMenu/src/openmenu/src \
            openMenu/src/openmenu/test/clock_test.c openMenu/src/openmenu/src/clock_math.c -o clock_test
          ./clock_test

      - uses: docker/setup-buildx-action@v3

      # The KOS toolchain build takes the better part of an hour, so cache it.
      - name: Build dev image (KOS toolchain)
        uses: docker/build-push-action@v6
        with:
          context: openMenu/docker
          platforms: linux/amd64
          load: true
          tags: openmenu-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build openMenu
        run: |
          docker run --rm --platform linux/amd64 --user "$(id -u):$(id -g)" \
            -v "$PWD/openMenu:/workspaces/openmenu" -w /workspaces/openmenu \
            openmenu-build:ci bash -c '
              source /opt/toolchains/dc/kos/environ.sh &&
              cmake --preset dc-release &&
              cmake --build --preset dc-release'

      - uses: actions/upload-artifact@v4
        with:
          name: 1ST_READ.BIN
          path: openMenu/cmake-build-dc-release/bin/1ST_READ.BIN
          if-no-files-found: error
